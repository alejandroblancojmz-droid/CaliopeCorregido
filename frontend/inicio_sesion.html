<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio de Sesión</title>
    <link rel="stylesheet" href="inicio_sesion.css">
</head>
<body>

    <div class="contenedor">
        <h2>Iniciar Sesión</h2>

        <form id="loginForm">
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <input type="password" id="password" placeholder="Contraseña" required>
            <button type="submit">Entrar</button>
        </form>

        <p id="mensaje"></p>

        <br>
        <a href="registro.html">¿No tienes cuenta?</a>
    </div>

    <script>
        document.getElementById("loginForm").addEventListener("submit", function(e) {
            e.preventDefault();

            let usuario = document.getElementById("correo").value;
            let password = document.getElementById("password").value;

            let usuarioCorrecto = "oscar@gmail.com";
            let passwordCorrecta = "1234";

            if (usuario === usuarioCorrecto && password === passwordCorrecta) {
                document.getElementById("mensaje").textContent = "Acceso permitido";
                window.location.href = "principal.html";
            } else {
                document.getElementById("mensaje").textContent = "Usuario o contraseña incorrectos";
            }
        });
    </script>

</body>
</html>
